<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Attorney review queue</title>
<style>
  :root { --bg: #f7f7f5; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --accent: #1f5f8b; --warn: #9a3412; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --card: #20201f; --ink: #ecebe6; --muted: #a3a29c; --line: #34332f; --accent: #7cb7e0; --warn: #fdba74; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 12px 0 0; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; min-height: 120px; }
  button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: 13px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 10px 0 2px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: 14px/1.5 ui-monospace, monospace; }
  .warn { color: var(--warn); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #status { margin-left: auto; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Attorney review queue</h1>
  <label>Token <input id="token" type="password" autocomplete="off" size="18"></label>
  <select id="filter">
    <option value="open">Open</option>
    <option value="">All</option>
    <option value="approved">Approved</option>
    <option value="edited_sent">Edited and sent</option>
    <option value="call_client">Call client</option>
    <option value="rejected">Rejected</option>
  </select>
  <button id="load" class="primary">Load</button>
  <span id="status"></span>
</header>
<main>
  <p class="meta warn">Unreviewed AI drafts are never shown to clients. Only text you approve or edit and send reaches the client.</p>
  <div id="list"></div>
</main>
<script src="/console/app.js"></script>
</body>
</html>
